<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf6ff" />
  <title>ことばクローゼット｜言叶衣橱</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/overrides.css" />
  <link rel="stylesheet" href="styles/takeover.css" />
  <link rel="stylesheet" href="styles/room.css" />
  <link rel="stylesheet" href="styles/mobile.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="言叶衣橱首页"><span>ことば</span>衣橱 <i>✦</i></a>
    <div class="actions">
      <button id="undoBtn" title="撤销">↶ <span>撤销</span></button>
      <button id="redoBtn" title="重做">↷ <span>重做</span></button>
      <button id="randomBtn">随机搭配</button>
      <button id="resetBtn" class="quiet">恢复初始</button>
    </div>
  </header>
  <main id="top" class="app-shell">
    <aside class="wardrobe panel" aria-label="衣橱">
      <div class="panel-heading"><div><p class="eyebrow">DRESS UP</p><h1>今天穿什么？</h1></div><button id="learningToggle" class="icon-toggle" aria-pressed="true" title="开关学习卡">あ</button></div>
      <label class="search"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="搜索中文、日文或假名" /></label>
      <div id="categoryTabs" class="tabs" aria-label="服饰分类"></div>
      <div class="filter-row"><select id="styleFilter" aria-label="风格筛选"><option value="">全部风格</option><option value="classic">经典</option><option value="sweet">甜美</option><option value="casual">休闲</option></select><select id="colorFilter" aria-label="颜色筛选"><option value="">全部颜色</option><option value="white">白色</option><option value="pink">粉色</option><option value="navy">海军蓝</option><option value="blue">蓝色</option><option value="mint">薄荷绿</option><option value="black">黑色</option><option value="brown">棕色</option><option value="cream">奶油／香槟色</option></select><button id="favoriteFilter" aria-pressed="false">♡ 收藏</button></div>
      <div id="itemGrid" class="item-grid" aria-live="polite"></div>
      <p class="prototype-note">当前：16 件图片服饰，可自由搭配并学习日语。</p>
    </aside>

    <section class="stage-wrap" aria-label="换装舞台">
      <div id="modeSwitch" class="mode-switch" role="group" aria-label="游戏模式"><button data-mode="free">自由换装</button><button data-mode="light">轻学习</button><button data-mode="scene" hidden>场景挑战</button></div>
      <div class="scene-picker"><label for="sceneSelect">背景场景</label><select id="sceneSelect"></select><button id="challengeBtn" hidden>查看挑战</button></div>

      <div id="stage" class="stage" role="img" aria-label="可换装的卡通角色">
        <div class="window"><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div></div><div class="floor"></div>
        <canvas id="outfitCanvas" width="1024" height="1536" aria-label="当前穿搭插画"></canvas>
        <div class="stage-badge">点击衣橱单品即可穿上 / 再点卸下</div>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div class="stage-actions"><button id="saveLookBtn">♡ 保存到相册</button><button id="exportBtn">⇩ 导出穿搭卡</button><button id="albumBtn" class="quiet">相册 <span id="albumCount">0</span></button></div>
    </section>

    <nav class="mobile-tabs" aria-label="手机面板"><button data-view="wardrobe" aria-selected="true">衣橱 · 换装</button><button data-view="study" aria-selected="false">あ 日语学习</button></nav>
    <aside id="learnPanel" class="learn panel" aria-label="日语学习卡">
      <div class="panel-heading"><div><p class="eyebrow">WORD OF THE LOOK</p><h2>穿一件，学一句</h2></div><button id="speakBtn" class="round" title="朗读日语">♬</button></div>

      <article id="wordCard" class="word-card"></article><label class="slow-control"><input id="slowSetting" type="checkbox" /> 慢一点读</label>
            <details class="extra-settings"><summary>浏览更多词汇</summary><label class="lexeme-picker">词汇浏览<select id="lexemeSelect" aria-label="选择学习词汇"></select></label></details>
      <details class="extra-settings scene-study"><summary>生活日语 · 当前场景</summary><div id="sceneBrief" class="scene-brief" aria-live="polite"></div></details>
      <details id="practiceDetails" class="practice-details"><summary>练一下 · 可选</summary>
      <div class="practice-head"><h3>轻练习</h3><button id="newQuestionBtn" class="text-btn">换一题</button></div>
      <button id="reviewBtn" class="review-btn">复习到期内容</button>

      <section id="questionCard" class="question-card"></section>
      <section id="challengeCard" class="challenge-card"></section>
      </details>
      <details class="extra-settings"><summary>声音与设置</summary><label class="voice-picker">日语声音<select id="voiceSelect" aria-label="日语声音"></select></label><p id="voiceStatus" class="reading"></p><button id="voicePreview" class="text-btn">▶ 试听</button>
      <div class="settings"><label><input id="kanaSetting" type="checkbox" checked /> 显示读音</label><label><input id="motionSetting" type="checkbox" /> 减少动效</label><button id="backupBtn" class="text-btn">导出备份</button><label class="import-label">导入备份<input id="importInput" type="file" accept="application/json" /></label></div>
      </details>
    </aside>
  </main>
  <dialog id="albumDialog"><button id="closeAlbum" class="dialog-close" aria-label="关闭">×</button><p class="eyebrow">LOOKBOOK</p><h2>我的相册</h2><div id="albumGrid" class="album-grid"></div></dialog>
  <p id="runtimeHint" class="runtime-hint" role="alert" hidden></p>
  <script type="module" src="src/game.js"></script>
  <script type="module" src="src/mobile.js"></script>
  <script>
    window.setTimeout(function () {
      if (document.body.dataset.appReady === 'true') return;
      var hint = document.getElementById('runtimeHint');
      hint.hidden = false;
      hint.textContent = location.protocol === 'file:'
        ? '衣橱需要通过本地 HTTP 服务打开：请在项目目录运行 node scripts/serve.js，再访问 http://localhost:8000。'
        : '衣橱脚本没有正确加载。请刷新页面；若仍出现此提示，请检查浏览器开发者工具。';
    }, 1200);
  </script>
</body>
</html>
